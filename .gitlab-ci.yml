# Next.js production deploy.
# Required protected CI/CD variables (configured by the host):
# SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, SSH_USER, DEPLOY_IPADDRESS, DEPLOY_PATH.
# Optional: APP_PORT (defaults to 3000), APP_NAME (defaults to art-studio-inspire).

image: node:20-alpine

deploy_prod:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh "$SSH_USER@$DEPLOY_IPADDRESS" "DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='${APP_PORT:-3000}' APP_NAME='${APP_NAME:-art-studio-inspire}' sh -s" <<'REMOTE'
      set -eu
      umask 002
      cd "$DEPLOY_PATH"
      git pull --ff-only
      export NEXT_TELEMETRY_DISABLED=1
      npm ci
      npm run build
      if ! command -v pm2 >/dev/null 2>&1; then
        echo "PM2 is required on the hosting account to keep Next.js running."
        exit 1
      fi
      if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
        PORT="$APP_PORT" pm2 restart "$APP_NAME" --update-env
      else
        PORT="$APP_PORT" pm2 start npm --name "$APP_NAME" -- start
      fi
      pm2 save
      REMOTE
