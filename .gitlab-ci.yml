# Next.js deploy uz ISPConfig vietni artinspire.lv (client5/web63) caur jailkit shell useri.
#
# Plūsma vienā jobā: build CI konteinerā (node:22) -> rsync standalone izvadu uz /web/app jail iekšā
#                    -> nokauj Node procesu, PM2 uz hosta to paceļ ar jauno kodu.
# Viens jobs, jo artefaktu augšupielāde uz šo GitLab atdod 405 (vecs runner pret GitLab 18).
#
# Prasība projektam: next.config.mjs ar  output: 'standalone'  (jau ir)
#
# GitLab CI/CD mainīgie:
#   grupas līmenī (jau ir): SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, SSH_USER, DEPLOY_IPADDRESS, DEPLOY_PATH=/web/app
#   projekta līmenī (jāpieliek, tie ir publiski un tiek iekompilēti klienta JS):
#     NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   Servera noslēpumi (STRIPE_*, SUPABASE_SERVICE_ROLE_KEY, RESEND_*, ADMIN_EMAIL) dzīvo tikai
#   serverī failā /web/app/.env, rsync to neaiztiek.

stages:
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"

deploy_prod:
  stage: deploy
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - package.json
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  environment:
    name: production
    url: https://artinspire.lv
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # --- build ---
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - |
      if [ ! -f .next/standalone/server.js ]; then
        echo "KĻŪDA: .next/standalone/server.js nav. next.config vajag  output: 'standalone'"
        exit 1
      fi
    - mkdir -p deploy
    - cp -r .next/standalone/. deploy/
    - mkdir -p deploy/.next/static && cp -r .next/static/. deploy/.next/static/
    - if [ -d public ]; then mkdir -p deploy/public && cp -r public/. deploy/public/; fi
    - du -sh deploy
    # --- deploy: .env paliek serverī, viss pārējais tiek aizstāts ar jauno build ---
    - |
      rsync -az --delete \
        --exclude '.env' \
        --chmod=Du=rwx,Dg=rx,Do=x,Fu=rw,Fg=r,Fo= \
        deploy/ "$SSH_USER@$DEPLOY_IPADDRESS:$DEPLOY_PATH/"
    # Jail iekšā nav /proc, tāpēc nevis pkill, bet PID no faila, ko raksta PM2. PM2 procesu paceļ no jauna.
    - |
      ssh "$SSH_USER@$DEPLOY_IPADDRESS" '
        set -- /private/artinspire*.pid
        if [ -f "$1" ]; then
          kill "$(cat "$1")" && echo "Node process $(cat "$1") nokauts, PM2 restartē"
        else
          echo "PID fails nav: pirmais deploy, PM2 vēl jāstartē kā root (sk. README 4.4)"
        fi'
